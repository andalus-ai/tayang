name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repo ships only lib/, test/ and pubspec; generate platform folders for CI.
      - run: flutter create . --project-name tayang --platforms=android --org ai.andalus
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
