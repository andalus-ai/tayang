name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Real ffmpeg so the export integration test runs end to end.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      # Capture output so the report step can publish it (readable without log access).
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          echo $? > analyze.code
      - name: Test
        run: |
          set +e
          flutter test > test.txt 2>&1
          echo $? > test.code
      - name: Report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### flutter analyze (exit $(cat analyze.code 2>/dev/null))"
            echo '```'; tail -c 28000 analyze.txt 2>/dev/null; echo '```'
            echo "### flutter test (exit $(cat test.code 2>/dev/null))"
            echo '```'; tail -c 24000 test.txt 2>/dev/null; echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md || true
      - name: Fail if analyze or tests failed
        run: test "$(cat analyze.code)" = 0 && test "$(cat test.code)" = 0

  platform-builds:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android-release, os: ubuntu-latest, cmd: 'flutter build apk --release' }
          - { name: ios, os: macos-latest, cmd: 'flutter build ios --debug --no-codesign' }
          - { name: macos, os: macos-latest, cmd: 'flutter build macos --debug' }
          - { name: windows, os: windows-latest, cmd: 'flutter build windows --debug' }
          - { name: linux, os: ubuntu-latest, cmd: 'flutter build linux --debug', linux: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.linux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libjson-glib-dev libmpv-dev mpv
      - run: flutter pub get
      - name: Build
        run: |
          set +e
          for attempt in 1 2 3; do
            ${{ matrix.cmd }} > build.txt 2>&1
            code=$?
            [ "$code" = 0 ] && break
            # Retry only transient network failures (e.g. Maven Central 429).
            grep -qE "status code 429|Could not GET|Connection reset|timed out" build.txt || break
            sleep 45
          done
          echo $code > build.code
      - name: Report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### build ${{ matrix.name }} (exit $(cat build.code 2>/dev/null))"
            echo '```'; head -c 3500 build.txt 2>/dev/null; echo; echo '[...]'; tail -c 9000 build.txt 2>/dev/null; echo '```'
          } > build.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@build.md || true
      - name: Fail if the build failed
        run: test "$(cat build.code)" = 0

  android-emulator:
    name: FFmpegKit export on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/run_android_it.sh
      - name: Report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### android emulator integration test (exit $(cat it.code 2>/dev/null))"
            echo '```'; head -c 2500 it.txt 2>/dev/null; echo; echo '[...]'; tail -c 9000 it.txt 2>/dev/null; echo '```'
          } > it.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@it.md || true
      - name: Fail if the integration test failed
        run: test "$(cat it.code)" = 0

  desktop-integration:
    name: FFmpegKit integration (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest, device: macos }
          - { name: windows, os: windows-latest, device: windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run integration test on ${{ matrix.name }}
        run: |
          set +e
          flutter test integration_test -d ${{ matrix.device }} > it.txt 2>&1
          echo $? > it.code
      - name: Report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### desktop integration test ${{ matrix.name }} (exit $(cat it.code 2>/dev/null))"
            echo '```'; head -c 2500 it.txt 2>/dev/null; echo; echo '[...]'; tail -c 9000 it.txt 2>/dev/null; echo '```'
          } > it.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@it.md || true
      - name: Fail if the integration test failed
        run: test "$(cat it.code)" = 0
