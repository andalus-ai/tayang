name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # v1.2.3 or v1.2.3-rc.1 -> 1.2.3 (store/OS version fields must be numeric)
  TAG_NAME: ${{ github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Signing keystore (only when secrets are configured)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
            echo "Signing with the configured upload key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK is signed with the debug key (not for the Play Store)."
          fi
      - name: Build
        run: |
          NAME=$(echo "${TAG_NAME#v}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo 1.0.0)
          flutter build apk --release --build-name "$NAME" --build-number ${{ github.run_number }}
          flutter build appbundle --release --build-name "$NAME" --build-number ${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk tayang-android.apk
          cp build/app/outputs/bundle/release/app-release.aab tayang-android.aab
      - uses: actions/upload-artifact@v4
        with: { name: android, path: 'tayang-android.*' }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build
        shell: bash
        run: |
          NAME=$(echo "${TAG_NAME#v}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo 1.0.0)
          flutter build windows --release --build-name "$NAME" --build-number ${{ github.run_number }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tayang-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: tayang-windows.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build
        run: |
          NAME=$(echo "${TAG_NAME#v}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo 1.0.0)
          flutter build macos --release --build-name "$NAME" --build-number ${{ github.run_number }}
          ditto -c -k --keepParent build/macos/Build/Products/Release/tayang.app tayang-macos.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: tayang-macos.zip }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libjson-glib-dev
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build
        run: |
          NAME=$(echo "${TAG_NAME#v}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo 1.0.0)
          flutter build linux --release --build-name "$NAME" --build-number ${{ github.run_number }}
          tar -czf tayang-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: tayang-linux.tar.gz }

  publish:
    needs: [android, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Tayang $TAG_NAME" \
            --notes "Unsigned desktop builds. Linux needs ffmpeg installed; Windows/macOS use the bundled FFmpegKit."
